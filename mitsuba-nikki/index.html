<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みつば日記</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #6e6e73;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 48px 20px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  .back {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
  }
  .header-link {
    display: flex;
    text-decoration: none;
    color: inherit;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  header .app-icon {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    flex-shrink: 0;
    display: block;
  }
  h1 {
    font-size: 26px;
    margin: 0;
  }
  p.lead {
    color: var(--text-secondary);
    margin: 16px 0 40px;
  }
  .links {
    display: grid;
    gap: 12px;
  }
  a.link-card {
    display: block;
    padding: 16px 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← yumemiya-lab</a>
  <a class="header-link" href="https://apps.apple.com/jp/app/%E3%81%BF%E3%81%A4%E3%81%B0%E6%97%A5%E8%A8%98-3%E3%81%A4%E3%81%AE%E3%81%84%E3%81%84%E3%81%93%E3%81%A8/id6794611459" target="_blank" rel="noopener">
    <header>
      <img class="app-icon" src="./icon-mitsuba-nikki.png" alt="みつば日記 アイコン">
      <h1>みつば日記</h1>
    </header>
  </a>
  <p class="lead">その日あった3つの良かったことを書き留めて、前向きな習慣を育てる日記アプリです。</p>
  <div class="links">
    <a class="link-card" href="./about.html">「3つのいいこと」について</a>
    <a class="link-card" href="./privacy.html">プライバシーポリシー</a>
    <a class="link-card" href="../#contact">お問い合わせ</a>
  </div>
</main>
</body>
</html>
